{% extends "public/base_public.html" %}
{% block title %}Email Terkirim — SIDAMA{% endblock %}

{% block content %}
<section class="section-tight" style="padding-top:48px;">
  <div class="container-narrow">
    <div class="panel" style="max-width:560px;">
      <h1 style="font-family:var(--font-display);font-weight:400;font-size:1.9rem;margin:0 0 10px;">Periksa email Anda</h1>

      <a class="btn btn-outline" href="{% url 'accounts:login' %}">Kembali ke halaman masuk</a>
    </div>
  </div>
</section>
{% endblock %}
