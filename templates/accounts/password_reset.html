{% extends "public/base_public.html" %}
{% block title %}Lupa Kata Sandi — SIDAMA{% endblock %}

{% block content %}
<section class="section-tight" style="padding-top:48px;">
  <div class="container-narrow">
    <div class="panel" style="max-width:560px;">
      <span class="eyebrow">Pemulihan akun</span>
      <h1 style="font-family:var(--font-display);font-weight:400;font-size:1.9rem;letter-spacing:-0.03em;margin:8px 0 10px;">Lupa kata sandi?</h1>
      <p class="muted small">Masukkan email terdaftar. Kami akan mengirim tautan untuk membuat kata sandi baru.</p>
      <form method="post" novalidate>
        {% csrf_token %}
        <div class="field mb-2">
          <label for="id_email">Email</label>
          <input class="input" type="email" name="email" id="id_email" required autofocus>
        </div>
        <button class="btn" type="submit">Kirim tautan reset</button>
      </form>
    </div>
  </div>
</section>
{% endblock %}
