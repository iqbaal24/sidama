# SIDAMA — Render blueprint (SATU web service, tanpa database, tanpa kartu)
#
# Deploy: New > Blueprint, pilih repo ini. Blueprint ini hanya membuat satu web
# service free dan memakai SQLite, sehingga Render tidak meminta kartu.
# Ingin data tetap awet setelah redeploy? Set DATABASE_URL dari Neon
# (gratis, tanpa kartu) di dashboard Render.
services:
  - type: web
    name: sidama
    runtime: python
    plan: free
    region: singapore
    branch: main
    buildCommand: "./build.sh"
    startCommand: "./start.sh"
    healthCheckPath: /healthz/
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: "localhost,127.0.0.1"
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "1"
      - key: SIDAMA_PUBLIC_ONLY
        value: "1"
      - key: SIDAMA_DEMO_AUTO_CONFIRM
        value: "1"
      - key: CELERY_BROKER_URL
        value: "disabled"
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "1"
      - key: DB_ENGINE
        value: "sqlite"
