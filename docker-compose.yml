services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sidama}
      POSTGRES_USER: ${POSTGRES_USER:-sidama}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sidama}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sidama} -d ${POSTGRES_DB:-sidama}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  web:
    build: .
    environment: &sidama-env
      DJANGO_DEBUG: "0"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-ubah-kunci-ini-di-produksi}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:8080}
      DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-0}
      DB_ENGINE: postgres
      POSTGRES_DB: ${POSTGRES_DB:-sidama}
      POSTGRES_USER: ${POSTGRES_USER:-sidama}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sidama}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_TASK_ALWAYS_EAGER: "0"
    volumes:
      - media:/app/media
      - staticfiles:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: .
    command: ["celery", "-A", "config", "worker", "-l", "info", "--concurrency", "2"]
    environment: *sidama-env
    volumes:
      - media:/app/media
      - staticfiles:/app/staticfiles
    depends_on:
      - web
      - redis
    restart: unless-stopped

  beat:
    build: .
    command: ["celery", "-A", "config", "beat", "-l", "info"]
    environment: *sidama-env
    volumes:
      - media:/app/media
    depends_on:
      - web
      - redis
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - media:/var/www/media:ro
      - staticfiles:/var/www/staticfiles:ro
    depends_on:
      - web
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  media:
  staticfiles:
