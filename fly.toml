# SIDAMA — Fly.io (opsional; butuh kartu terdaftar)
app = "sidama-demo"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  DJANGO_DEBUG = "0"
  DJANGO_ALLOWED_HOSTS = "sidama-demo.fly.dev"
  DJANGO_SECURE_SSL_REDIRECT = "1"
  CELERY_BROKER_URL = "disabled"
  CELERY_TASK_ALWAYS_EAGER = "1"
  DB_ENGINE = "sqlite"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.http_options.response.headers]
    X-Content-Type-Options = "nosniff"

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/healthz/"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[mounts]
  source = "sidama_data"
  destination = "/app/data"
